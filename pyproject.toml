[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-football-betting-machine"
version = "0.1.0"
description = "End-to-end football betting ML pipeline with value-bet backtesting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "requests>=2.31"
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]

[project.scripts]
football-bet = "football_betting_machine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
